[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-code-checker"
version = "0.1.0"
description = "LLM-first code-quality checks over Agent Bridge"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aleksandr Kovalenko" }]
dependencies = [
  "codex-antigravity-a2a-bridge>=0.2,<1",
  "mcp>=1.30,<2",
]

[project.scripts]
agent-code-checker = "agent_code_checker.cli:main"
agent-code-checker-mcp = "agent_code_checker.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_code_checker*"]

[tool.setuptools.package-data]
agent_code_checker = ["profiles/data/*.json"]
