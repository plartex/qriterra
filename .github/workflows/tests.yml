name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Agent Shuttle and Qriterra
        run: |
          python -m pip install "git+https://github.com/${{ github.repository_owner }}/agent-shuttle.git"
          python -m pip install -e .
      - name: Run offline tests
        run: python -m unittest discover -s tests -q
